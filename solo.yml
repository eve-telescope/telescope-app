# Visit https://soloterm.com to learn more
name: telescope-app
icon: null
processes:
    app:
        command: cargo run -p telescope-app
        working_dir: null
        auto_start: false
        auto_restart: false
        restart_when_changed: []
        env: {}

    test:
        command: cargo test --workspace
        auto_start: false

    # Mirrors the CI job: fmt check, clippy, tests
    check:
        command: cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace
        auto_start: false

    format:
        command: cargo fmt --all
        auto_start: false

    package:
        command: cargo packager --release -p telescope-app
        auto_start: false
