[package]
name = "telescope-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EVE Online intel tool"

[[bin]]
name = "telescope"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
futures = "0.3"
global-hotkey = "0.8"
gpui-kit = "0.7"
interprocess = "2"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
telescope-core = { path = "../telescope-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[package.metadata.packager]
product-name = "Telescope"
identifier = "com.timkunze.telescope"
description = "EVE Online intel tool"
authors = ["Nicolas Kion"]
category = "Utility"
binaries = [{ path = "telescope", main = true }]
icons = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
]
deep-link-protocols = [{ schemes = ["telescope"] }]

[package.metadata.packager.macos]
# Ad-hoc signature, as the Tauri release used.
signing-identity = "-"
