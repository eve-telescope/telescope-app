[package]
name = "telescope-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4"
dirs = "6"
futures = "0.3"
log = "0.4"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
url = "2"
urlencoding = "2.1.3"
zip = "8"
