version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # gpui-kit pins a matching gpui-pre snapshot; upgrade them together.
      - dependency-name: "gpui-pre*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
