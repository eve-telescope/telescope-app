name: "Release"

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            formats: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release -p telescope-app --target ${{ matrix.target }}

      - name: Package
        shell: bash
        working-directory: crates/telescope-app
        run: |
          cargo packager --release --target ${{ matrix.target }} \
            --formats ${{ matrix.formats }} --out-dir ../../dist

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "telescope-app") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Telescope v${{ steps.version.outputs.version }}
          body: See the assets to download and install Telescope.
          draft: true
          files: |
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*-setup.exe
